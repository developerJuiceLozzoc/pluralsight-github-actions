<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 { font-size: 2.5rem; margin-bottom: 1rem; letter-spacing: 2px; }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      min-height: 1.8rem;
      transition: color 0.3s;
    }
    .status.winner { color: #f6c90e; font-weight: bold; }
    .status.draw    { color: #a0aec0; font-weight: bold; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows:    repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    .cell:hover:not(.x):not(.o) { background: #0f3460; transform: scale(1.04); }
    .cell.x { color: #e94560; }
    .cell.o { color: #0f9b8e; }
    .cell.win { background: #2d3748; box-shadow: 0 0 12px 4px rgba(246,201,14,0.6); }

    #reset-btn {
      margin-top: 1.6rem;
      padding: 0.7rem 2.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }
    #reset-btn:hover { background: #c73652; transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status" class="status">Player X's turn</div>
  <div class="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <button id="reset-btn">New Game</button>

  <script src="src/game.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
