name: Team Approval Workflow
on: pull_request_review

jobs:
  labelWhenApproved:
    runs-on: ubuntu-latest
    steps:
      - name: Label approved pull requests
        uses: orhan/trafico@1.0.0
        env:
          APPROVALS: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADD_LABEL: "Approoooved"
        


